schema: spec-driven

context: |
  Tech stack: Flask (Python) + React (Vite 5 + Tailwind 3.4)
  Database: SQLite (dev) / MySQL (prod via pymysql) + SQLAlchemy + Flask-Migrate
  Auth: Flask-JWT-Extended (3 roles: admin, alumno, profesor) — JWT 2h
  Architecture: Monorepo backend/ (Flask REST /api) + frontend/ (React) — Docker + Dokploy VPS 89.116.51.59
  Build: Vite 5 + React 18 + axios + lucide-react + react-router-dom
  Testing: pytest (backend) + vitest/jsdom + Playwright E2E (frontend) — 12 pytest + 5 vitest + 3 e2e specs

strict_tdd: true

testing:
  runner:
    backend: "pytest -v --tb=short"
    frontend: "npm run test -- vitest run"
    e2e: "npx playwright test"
  layers:
    unit: { available: true, tool: "vitest + pytest" }
    integration: { available: true, tool: "@testing-library/react + httpx" }
    e2e: { available: true, tool: "Playwright" }
  coverage:
    available: true
    backend: "pytest --cov (pytest-cov)"
    frontend: "vitest run --coverage"
  quality:
    linter: { available: false, command: "—" }
    type_checker: { available: false, command: "—" }
    formatter: { available: false, command: "—" }

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

apply:
  tdd: true
  test_command: "pytest -v --tb=short"

verify:
  test_command: "pytest -v --tb=short && npm run test -- vitest run"
  build_command: "npm run build"
  coverage_threshold: 0
