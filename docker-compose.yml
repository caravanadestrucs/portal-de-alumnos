version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5050:5000"
    volumes:
      - portal-db:/app/instance
    environment:
      - FLASK_APP=app.py
      - DATABASE_URL=sqlite:////app/instance/portal.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - portal-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_ALUMNO_INVITE_TOKEN=ca2d949f-5cd2-4785-918e-205d6566f4e7
        - VITE_PROFESOR_INVITE_TOKEN=ef4a3a25-0214-4581-97dc-5104bb06c748
    ports:
      - "3050:3000"
    environment:
      - VITE_API_URL=/api
      - VITE_ALUMNO_INVITE_TOKEN=ca2d949f-5cd2-4785-918e-205d6566f4e7
      - VITE_PROFESOR_INVITE_TOKEN=ef4a3a25-0214-4581-97dc-5104bb06c748
      - CHOKIDAR_USEPOLLING=true
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - portal-network

networks:
  portal-network:
    driver: bridge

volumes:
  portal-db:
